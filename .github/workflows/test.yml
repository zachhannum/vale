name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# CI does not use a debugger, and the builds without debug info are faster
# and make a smaller cache.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # A PR builds only the apps that it touches. A push to `main` and a run by
  # hand build both apps.
  changes:
    name: Find the apps that the change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      vale: ${{ steps.apps.outputs.vale }}
      isotherm: ${{ steps.apps.outputs.isotherm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the script
        run: python3 -m unittest discover scripts/ci

      - name: Find the apps
        id: apps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/changes.py "$BASE" "$HEAD"

  test:
    name: Test the fast tier and the UI tier of Vale
    needs: changes
    if: needs.changes.outputs.vale == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Check the format
        run: cargo fmt --all --check

      - name: Run the fast tier and the UI tier
        run: cargo test --workspace --exclude 'isotherm-*'

  isotherm:
    name: Test Isotherm (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.isotherm == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config

      # The PROJ build needs the SQLite library and the `sqlite3` program.
      - name: Install SQLite
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install "sqlite3[tool]:x64-windows-static-md"
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md"
          echo "CMAKE_PREFIX_PATH=$root" >> "$GITHUB_ENV"
          echo "$root/tools/sqlite3" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Check the format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # The tests of the `isotherm-` crates build the Vale crates that they use,
      # and no other Vale crate.
      - name: Run the fast tier and the UI tier
        shell: bash
        run: cargo test --workspace --exclude 'vale-*'

  gpu:
    name: Test the GPU tier (${{ matrix.name }})
    # The GPU tier takes about an hour, so it runs only on `main` and by hand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: globe
            tests: -p vale-app --test globe
          - name: flat
            tests: -p vale-app --test flat
          - name: pad
            tests: -p vale-app --test pad
          - name: other files
            tests: -p vale-app --test atlas --test export --test frame_raster --test import --test inspector --test session --test ui
          - name: terrain
            tests: -p vale-terrain --features gpu --test gpu
          - name: render
            tests: -p vale-render --features gpu --test gpu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Lavapipe is the software Vulkan driver of Mesa. The GPU tier draws on it.
      - name: Install the software GPU and the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 \
            libfontconfig1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      # The GPU tier is the tests with `#[ignore = "gpu"]`. The ignored tests with
      # the prefix `manual_` save pictures or give times, and they run only by hand.
      # The runner has few cores. If tests render in parallel, a frame can
      # take longer than egui_kittest waits, so the tests run one at a time.
      - name: Run the GPU tier
        run: cargo test ${{ matrix.tests }} -- --ignored --skip manual_ --test-threads=1
