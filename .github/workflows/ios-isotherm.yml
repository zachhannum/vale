name: iOS Isotherm

# A PR runs this workflow only if it changes Isotherm or a part that Isotherm uses.
# `scripts/ci/paths.py` gives the list of the paths.
on:
  pull_request:
    paths:
      - "crates/isotherm-*/**"
      - "docs/isotherm/**"
      - "scripts/isotherm-ipad.sh"
      - "crates/vale-globe/**"
      - "crates/vale-import/**"
      - "crates/vale-shell/**"
      - "crates/vale-sphere/**"
      - "crates/vale-store/**"
      - "crates/vale-terrain/**"
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "assets/**"
      - "scripts/ci/**"
      - "scripts/ipad-run.sh"
      - "scripts/testflight/**"
      - "vendor/**"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-isotherm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Isotherm
    uses: ./.github/workflows/ios-app.yml
    with:
      app: isotherm
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
