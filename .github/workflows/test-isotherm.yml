name: Test Isotherm

# A PR runs this workflow only if it changes Isotherm or a part that Isotherm uses.
# `scripts/ci/paths.py` gives the list of the paths.
on:
  pull_request:
    paths:
      - "crates/isotherm-*/**"
      - "docs/isotherm/**"
      - "scripts/isotherm-ipad.sh"
      - "crates/vale-globe/**"
      - "crates/vale-import/**"
      - "crates/vale-shell/**"
      - "crates/vale-sphere/**"
      - "crates/vale-store/**"
      - "crates/vale-terrain/**"
      - ".github/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "assets/**"
      - "scripts/ci/**"
      - "scripts/ipad-run.sh"
      - "scripts/testflight/**"
      - "vendor/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-isotherm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: Test Isotherm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install the system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config

      # The PROJ build needs the SQLite library and the `sqlite3` program.
      - name: Install SQLite
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install "sqlite3[tool]:x64-windows-static-md"
          root="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md"
          # CMake looks for programs in the `bin` folder of each prefix.
          mkdir -p "$root/bin"
          find "$root" -iname sqlite3.exe -exec cp {} "$root/bin/" \;
          test -f "$root/bin/sqlite3.exe"
          echo "CMAKE_PREFIX_PATH=$(cygpath -m "$root")" >> "$GITHUB_ENV"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Test the CI scripts
        if: runner.os == 'Linux'
        run: python3 -m unittest discover scripts/ci

      - name: Check the format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # The tests of the `isotherm-` crates build the Vale crates that they use,
      # and no other Vale crate.
      - name: Run the fast tier and the UI tier
        shell: bash
        run: cargo test --workspace --exclude 'vale-*'

  gpu:
    name: Test the GPU tier of Isotherm
    # The GPU tier runs only on `main` and by hand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Lavapipe is the software Vulkan driver of Mesa. The GPU tier draws on it.
      - name: Install the software GPU and the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 \
            libfontconfig1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Run the GPU tier
        run: cargo test -p isotherm-app --test gpu -- --ignored --skip manual_ --test-threads=1

      - name: Run the GPU tier of the compute shaders
        run: cargo test -p isotherm-gpu --test gpu -- --ignored
