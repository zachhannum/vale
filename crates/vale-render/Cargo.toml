[package]
name = "vale-render"
description = "Display list and raster and PDF backends for Vale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kurbo.workspace = true
vello_cpu.workspace = true
krilla = { workspace = true, features = ["raster-images"] }
usvg.workspace = true
vale-labeler.workspace = true
vello = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[features]
gpu = ["dep:vello", "dep:wgpu"]

[dev-dependencies]
pollster.workspace = true
wgpu = { workspace = true, features = ["vulkan", "metal", "gles"] }

[[test]]
name = "gpu"
required-features = ["gpu"]
