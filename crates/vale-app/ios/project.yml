# xcodegen reads this file and writes ValeApp.xcodeproj.
name: ValeApp
options:
  bundleIdPrefix: dev.vale
  deploymentTarget:
    iOS: "16.0"
targets:
  ValeApp:
    type: application
    platform: iOS
    sources:
      - main.m
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The app has no encryption of its own, so TestFlight does not ask about it.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vale.app
        TARGETED_DEVICE_FAMILY: "2"
        # CI sets the version and the build number of each TestFlight build.
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # PROJ is in the Rust library. It needs the C++ library and SQLite.
        OTHER_LDFLAGS: -lvale_app -lc++ -lsqlite3
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../../target/aarch64-apple-ios-sim/release
    preBuildScripts:
      - name: Build the Rust library
        script: sh "$PROJECT_DIR/build-rust.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
