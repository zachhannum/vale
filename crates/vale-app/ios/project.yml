# xcodegen reads this file and writes ValeApp.xcodeproj.
name: ValeApp
options:
  bundleIdPrefix: dev.vale
  deploymentTarget:
    iOS: "16.0"
targets:
  ValeApp:
    type: application
    platform: iOS
    sources:
      - main.m
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vale
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vale.app
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # PROJ is in the Rust library. It needs the C++ library and SQLite.
        OTHER_LDFLAGS: -lvale_app -lc++ -lsqlite3
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../../../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../../target/aarch64-apple-ios-sim/release
    preBuildScripts:
      - name: Build the Rust library
        script: sh "$PROJECT_DIR/build-rust.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
